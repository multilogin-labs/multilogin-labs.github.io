[project]
name = "multilogin-labs-site"
description = "Static site automation scripts for multilogin-labs.github.io"
requires-python = ">=3.11"
version = "0.0.0"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["scripts/__pycache__"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "W",   # pycodestyle warnings
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
]
ignore = [
  "E501", # long lines acceptable in HTML templates and JSON-LD blocks
  "E402", # late imports for sys.path tweaks in migrate_site
  "B007", # unused loop control vars are common in HTML iter patterns
  "B904", # raise from inside except not always needed for CLI scripts
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["UP015"]

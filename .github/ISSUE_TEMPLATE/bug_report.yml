name: Bug report
description: Broken link, tool error, or data issue
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://multilogin-labs.github.io/...
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Other

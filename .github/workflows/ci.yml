name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Full site automation (maintenance + llms; homepage guard)
        run: python3 scripts/automate_site.py

      - name: Regenerate sitemap (dry diff)
        run: |
          python3 scripts/migrate_site.py
          git diff --exit-code sitemap.xml || (echo "::warning::sitemap.xml out of date — run migrate_site.py locally" && exit 0)

  indexnow:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ping IndexNow (Bing/Yandex)
        run: python3 scripts/indexnow.py --from-sitemap --limit 58
        continue-on-error: true
        env:
          INDEXNOW_PING: "1"

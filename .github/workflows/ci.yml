name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON datasets
        run: python3 scripts/validate_data.py

      - name: Check internal links
        run: python3 scripts/check_links.py

      - name: SEO optimize (links, sitemap, redirects)
        run: python3 scripts/seo_optimize.py

      - name: Regenerate sitemap (dry diff)
        run: |
          python3 scripts/migrate_site.py
          git diff --exit-code sitemap.xml || (echo "::warning::sitemap.xml out of date — run migrate_site.py locally" && exit 0)

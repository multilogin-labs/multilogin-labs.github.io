name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install --upgrade pip ruff==0.5.7
      - name: Ruff check
        run: ruff check scripts

  validate:
    name: Site maintenance + JSON-LD + a11y + sitemap
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Full site automation (maintenance + llms; homepage guard)
        run: python3 scripts/automate_site.py

      - name: Regenerate sitemap (structural drift only — ignore lastmod dates)
        run: |
          python3 scripts/migrate_site.py
          # Compare ignoring <lastmod> values so timezone drift between commit
          # and CI runner doesn't fail the build. URL set and priorities still gated.
          diff <(git show HEAD:sitemap.xml | grep -v '<lastmod>') \
               <(grep -v '<lastmod>' sitemap.xml) \
            || (echo "::error::sitemap.xml URL set out of date — run scripts/migrate_site.py locally and commit" && exit 1)

      - name: Verify homepage performance guardrails
        run: python3 scripts/optimize_home.py

      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-reports
          path: |
            docs/INDEX-HEALTH.md
            docs/INTERNAL-LINK-AUDIT.md
            docs/CONTENT-FRESHNESS.md
            docs/SCHEMA-COVERAGE.md
          if-no-files-found: warn
          retention-days: 30

  indexnow:
    name: IndexNow ping (main only)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ping IndexNow (Bing/Yandex)
        run: python3 scripts/indexnow.py --from-sitemap --limit 58
        continue-on-error: true
        env:
          INDEXNOW_PING: "1"
